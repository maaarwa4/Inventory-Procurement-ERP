<div class="form-container">
  <img src="assets/orange-logo.png" alt="Orange Business Logo" class="logo" />
  <h2>{{ isEdit ? 'Modifier' : 'Ajouter' }} un Produit</h2>

  <form (ngSubmit)="save()">
    <label>Nom:</label>
    <input type="text" [(ngModel)]="product.name" name="name" required />

    <label>Description:</label>
    <textarea [(ngModel)]="product.description" name="description"></textarea>

    <label>Prix:</label>
    <input type="number" [(ngModel)]="product.price" name="price" required />

    <label>Quantité:</label>
    <input type="number" [(ngModel)]="product.stock_quantity" name="stock_quantity" />

    <label>Brand:</label>
    <input type="text" [(ngModel)]="product.brand" name="brand" />

    <label>Catégorie:</label>
    <input type="text" [(ngModel)]="product.category" name="category" />

    <button type="submit">{{ isEdit ? 'Mettre à jour' : 'Créer' }}</button>
  </form>
</div>
