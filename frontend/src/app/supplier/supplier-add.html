<div class="form-container">
    <h2>Add New Supplier</h2>
  
    <form (ngSubmit)="saveSupplier()" #supplierForm="ngForm">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" [(ngModel)]="supplier.firstName" name="firstName" required />
      </div>
  
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" [(ngModel)]="supplier.lastName" name="lastName" required />
      </div>
  
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" [(ngModel)]="supplier.companyName" name="companyName" required />
      </div>
  
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="supplier.email" name="email" required />
      </div>
  
      <div class="form-group">
        <label>Phone</label>
        <input type="text" [(ngModel)]="supplier.phone" name="phone" />
      </div>
  
      <div class="form-group">
        <label>Address</label>
        <input type="text" [(ngModel)]="supplier.address" name="address" />
      </div>
  
      <div class="form-group">
        <label>Country</label>
        <input type="text" [(ngModel)]="supplier.country" name="country" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select [(ngModel)]="supplier.isActive" name="isActive">
          <option [ngValue]="true">Active</option>
          <option [ngValue]="false">Inactive</option>
        </select>
      </div>
  
      <div class="form-actions">
        <button type="submit" class="save-btn"  >💾 Save</button>
        <button type="button" class="cancel-btn" (click)="cancel()">❌ Cancel</button>
      </div>
    </form>
  </div>
